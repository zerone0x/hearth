name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install ripgrep (the box image has it; the grep executor test needs it)
        run: command -v rg || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep; }
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      # docs/demo.md (#36): the hub-box echo without Docker. The output is
      # captured first and grepped after, so a demo that hangs, fails or
      # prints neither line fails the step.
      - name: M0 demo (docs/demo.md)
        run: |
          out="$(timeout 60 bun apps/hub/src/demo.ts 2>&1)"
          printf '%s\n' "$out"
          grep -qxF 'box_demo connected' <<<"$out"
          grep -qxF 'POST /v1/boxes/box_demo/echo -> 200 {"ok":true,"result":{"message":"hello from the hub"}}' <<<"$out"

  # Web UI e2e (#46, decision 0017): the built UI in Chromium against a real
  # hub (faux model, box-agent as a local process, fake RFB server).
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: timeout 300 bun x playwright install --with-deps --only-shell chromium
      - name: Build the web UI
        run: timeout 300 bun run build:web
      # Browser tools on playwright-core against Playwright's headless shell over
      # CDP (#116, decision 0032): refs, refusals, verification, reconnect.
      - name: Browser tools on a real Chromium over CDP
        run: |
          shell="$(ls -d "$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-*/chrome-headless-shell | head -1)"
          test -x "$shell"
          HEARTH_CHROMIUM="$shell" timeout 300 bun test apps/box-agent/src/browser/playwright.test.ts apps/hub/src/runner/browser-tools.chromium.test.ts
      # The browser eval B1-B6 with box-agent as a local process on the same
      # Chromium (#119, decision 0040); the Docker run is in box-provider.
      - name: Browser eval B1-B6, local box-agent (scored from the trajectory)
        run: |
          shell="$(ls -d "$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-*/chrome-headless-shell | head -1)"
          HEARTH_CHROMIUM="$shell" HEARTH_EVAL_DIR="$RUNNER_TEMP/browser-eval-local" timeout 600 bun test apps/hub/src/eval/browser-eval.e2e.test.ts
      - name: Web e2e (setup, login, settings, session, tool card, desktop, reload, asleep, mobile)
        env:
          HEARTH_E2E_SCREENSHOTS: ${{ runner.temp }}/web-e2e
        run: timeout 300 bun run e2e:web
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-screenshots
          path: ${{ runner.temp }}/web-e2e
          if-no-files-found: ignore

  box-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < apps/box-agent/Dockerfile
      - name: Lint shell scripts
        run: shellcheck scripts/box-smoke.sh scripts/box-firewall.sh scripts/firewalld-reload-watch.sh apps/box-agent/image/entrypoint.sh
      - name: Build and smoke-test the box image
        run: scripts/box-smoke.sh

  # DockerBoxProvider against a real daemon (issue #6, decision 0007). Builds the
  # box image again (jobs do not share the local image store), derives an idle
  # variant that keeps the box running, and runs the HEARTH_DOCKER_TESTS suites:
  # the echo e2e on production defaults without and with the box firewall
  # (decision 0012), then the provider tests under the firewall.
  box-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build the box image
        run: |
          pi_version="$(jq -er '.dependencies["@earendil-works/pi-coding-agent"]' apps/box-agent/package.json)"
          timeout 1500 docker build -f apps/box-agent/Dockerfile \
            --build-arg "PI_VERSION=${pi_version}" -t hearth-box:ci .
          printf 'FROM hearth-box:ci\nCMD ["sleep", "infinity"]\n' |
            docker build -t hearth-box:ci-idle -
      # The firewall script against real iptables in throwaway network
      # namespaces: validation before any change, atomic apply, marker last
      # (decision 0012). As root, so `unshare -n` needs no user namespace.
      - name: Box firewall script in a network namespace
        run: sudo HEARTH_FIREWALL_TESTS=1 timeout 300 "$(command -v bun)" test apps/hub/src/box/firewall.test.ts
      # A stand-in for the owner's LAN (decision 0012): a web server on
      # 192.168.77.2 in a network namespace behind a veth pair, so traffic
      # from a box to it is forwarded by the host like traffic to a LAN host.
      - name: Set up a LAN host
        run: |
          sudo ip netns add hearthlan
          sudo ip link add hlan-host type veth peer name hlan-ns
          sudo ip link set hlan-ns netns hearthlan
          sudo ip addr add 192.168.77.1/24 dev hlan-host
          sudo ip link set hlan-host up
          sudo ip netns exec hearthlan ip addr add 192.168.77.2/24 dev hlan-ns
          sudo ip netns exec hearthlan ip link set lo up
          sudo ip netns exec hearthlan ip link set hlan-ns up
          sudo ip netns exec hearthlan ip route add default via 192.168.77.1
          sudo ip netns exec hearthlan sh -c \
            'nohup python3 -m http.server 8080 --bind 192.168.77.2 >/tmp/lan.log 2>&1 &'
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://192.168.77.2:8080/
      # Mutation guard: without the firewall the same probes reach the host
      # and the LAN, so the filtered run below cannot pass by accident.
      - name: Echo on production defaults, egress open (no firewall)
        env:
          HEARTH_DOCKER_TESTS: "1"
          HEARTH_BOX_AGENT_IMAGE: hearth-box:ci
          HEARTH_TEST_LAN_URL: http://192.168.77.2:8080/
          HEARTH_TEST_EGRESS: open
        run: timeout 600 bun test apps/hub/src/box/echo.docker.test.ts
      - name: Apply the box firewall
        run: |
          sudo scripts/box-firewall.sh apply
          sudo scripts/box-firewall.sh apply
          sudo iptables -S HEARTH-BOX-IN
          sudo iptables -S HEARTH-BOX-FWD
          sudo iptables -S DOCKER-USER
          sudo iptables -S FORWARD
          cat /run/hearth/box-egress.applied
      - name: Hub-box echo round trip on production defaults, egress filtered (M0 exit, #27, #20)
        env:
          HEARTH_DOCKER_TESTS: "1"
          HEARTH_BOX_AGENT_IMAGE: hearth-box:ci
          HEARTH_TEST_LAN_URL: http://192.168.77.2:8080/
          HEARTH_TEST_EGRESS: filtered
        run: timeout 600 bun test apps/hub/src/box/echo.docker.test.ts
      # Session manager (#42, #28; decision 0013): lazy start → hibernate →
      # wake, and a killed box classified as a crash and relaunched.
      - name: Session lifecycle and box supervision under the firewall
        env:
          HEARTH_DOCKER_TESTS: "1"
          HEARTH_BOX_AGENT_IMAGE: hearth-box:ci
        run: timeout 600 bun test apps/hub/src/session/session.docker.test.ts
      # M1 core proof (#43, decision 0015): the hub's pi runner on the faux
      # model edits a file in the box's /workspace and runs a command there;
      # the results come back as events through the HTTP API.
      - name: Pi runner turn in a Docker box under the firewall (M1 core, #43)
        env:
          HEARTH_DOCKER_TESTS: "1"
          HEARTH_BOX_AGENT_IMAGE: hearth-box:ci
        run: timeout 600 bun test apps/hub/src/runner/runner.docker.test.ts
      # Browser tools (#116, decision 0032): on the faux model the agent opens a
      # page served inside the box in the box's Chromium (CDP, decision 0026),
      # types, selects and clicks by ref with a verified expectation, takes a
      # screenshot, and the box's server log shows the submitted values.
      - name: Browser tools in a Docker box under the firewall (M2, #116)
        env:
          HEARTH_DOCKER_TESTS: "1"
          HEARTH_BOX_AGENT_IMAGE: hearth-box:ci
        run: timeout 600 bun test apps/hub/src/runner/browser.docker.test.ts
      # The browser eval (#119, decision 0040; M2 exit for S2): tasks B1-B6 on
      # the faux model in the box's Chromium against the fixture site served in
      # the box, the trajectory dumped with trajectory-cli.ts and scored by
      # browser-score.ts (success, false success, counts, secret leaks).
      - name: Browser eval B1-B6 in a Docker box under the firewall (M2 exit, #119)
        env:
          HEARTH_DOCKER_TESTS: "1"
          HEARTH_BOX_AGENT_IMAGE: hearth-box:ci
          HEARTH_EVAL_DIR: ${{ runner.temp }}/browser-eval
        run: timeout 900 bun test apps/hub/src/eval/browser-eval.e2e.test.ts
      - name: Upload the browser eval (trajectory, blobs, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-eval
          path: ${{ runner.temp }}/browser-eval
          if-no-files-found: ignore
      # Desktop stream (#45; decision 0016): the real Xvnc banner through the hub.
      - name: Desktop stream reads the real Xvnc banner through the hub, egress filtered
        env:
          HEARTH_DOCKER_TESTS: "1"
          HEARTH_BOX_AGENT_IMAGE: hearth-box:ci
        run: timeout 600 bun test apps/hub/src/desktop/desktop.docker.test.ts
      - name: Provider tests under the firewall
        env:
          HEARTH_DOCKER_TESTS: "1"
          HEARTH_BOX_IMAGE: hearth-box:ci-idle
        run: timeout 900 bun test apps/hub/src/box/docker/provider.docker.test.ts
      - name: Tool RPC through the real image (write, read, grep, exec, setsid kill, FIFO), egress filtered
        env:
          HEARTH_DOCKER_TESTS: "1"
          HEARTH_BOX_AGENT_IMAGE: hearth-box:ci
        run: timeout 600 bun test apps/hub/src/box/tools.docker.test.ts
      # #57 (decision 0018): a command in a real box scans /proc and finds
      # neither the join token nor a readable box-agent environ, maps or mem.
      - name: A command cannot read box-agent's secrets through /proc, egress filtered
        env:
          HEARTH_DOCKER_TESTS: "1"
          HEARTH_BOX_AGENT_IMAGE: hearth-box:ci
        run: timeout 600 bun test apps/hub/src/box/proc-secrets.docker.test.ts
      # #31 (decision 0028): `docker pause` freezes the box with its TCP
      # connection open; the hub's heartbeat declares it dead within its bound.
      - name: Heartbeat detects a paused box within the bound, egress filtered
        env:
          HEARTH_DOCKER_TESTS: "1"
          HEARTH_BOX_AGENT_IMAGE: hearth-box:ci
        run: timeout 600 bun test apps/hub/src/box/heartbeat.docker.test.ts

  # Prototype exit e2e (PRD §11.1, #47, decision 0020): docs/install.md run
  # verbatim on the runner (every block tagged install:<step>, extracted by
  # scripts/doc-block.sh), then Playwright walks every exit criterion against
  # the compose install, with the faux model server standing in for the model.
  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOC: ${{ github.workspace }}/docs/install.md
      RUN_BLOCK: ${{ github.workspace }}/scripts/run-doc-block.sh
      HEARTH_FAUX_KEY: sk-faux-compose-e2e
    steps:
      - uses: actions/checkout@v4
      - name: E2e paths
        run: |
          echo "HEARTH_E2E_SCREENSHOTS=$RUNNER_TEMP/compose-e2e" >> "$GITHUB_ENV"
          echo "HEARTH_E2E_STATE=$RUNNER_TEMP/compose-e2e-state.json" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Chromium for Playwright
        working-directory: deploy/e2e
        run: timeout 300 bun x playwright install --with-deps --only-shell chromium
      - name: Lint the deploy Dockerfiles and scripts
        run: |
          docker run --rm -i hadolint/hadolint:v2.15.1 < deploy/hub.Dockerfile
          docker run --rm -i hadolint/hadolint:v2.15.1 < deploy/firewall.Dockerfile
          shellcheck scripts/doc-block.sh scripts/run-doc-block.sh deploy/firewall-entrypoint.sh
      - name: Start the faux model server (127.0.0.1:18080)
        run: |
          nohup bun deploy/e2e/faux-model.ts 18080 > "$RUNNER_TEMP/faux-model.log" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:18080/faux/requests
      - name: "install.md: prerequisites"
        working-directory: deploy
        run: |
          "$RUN_BLOCK" -x "$DOC" install:prereq
      - name: "install.md: configure (then the owner's .env edit: the faux model)"
        working-directory: deploy
        run: |
          "$RUN_BLOCK" -x "$DOC" install:configure
          # The edit install.md asks for, done with the models-file option it documents.
          cat > config/models.json <<'JSON'
          {"providers":{"faux-http":{"baseUrl":"http://127.0.0.1:18080/v1","api":"openai-completions","models":[{"id":"faux-1","name":"Faux","input":["text","image"]}]}}}
          JSON
          sed -i -e 's/^HEARTH_MODEL_PROVIDER=.*/HEARTH_MODEL_PROVIDER=faux-http/' \
            -e 's/^HEARTH_MODEL=.*/HEARTH_MODEL=faux-1/' \
            -e 's|^HEARTH_MODELS_FILE=.*|HEARTH_MODELS_FILE=/etc/hearth/models.json|' .env
          cat .env
      - name: "install.md: add the model key"
        working-directory: deploy
        env:
          HEARTH_MODEL_KEY: ${{ env.HEARTH_FAUX_KEY }}
        run: |
          "$RUN_BLOCK" -x "$DOC" install:key
          test "$(stat -c %a secrets/model_key)" = 600
      - name: "install.md: create the vault key (decision 0031)"
        working-directory: deploy
        run: |
          "$RUN_BLOCK" "$DOC" install:vault-key
          test "$(stat -c %a secrets/vault_key)" = 600
          test "$(base64 -d secrets/vault_key | wc -c)" = 32
          sum="$(sha256sum secrets/vault_key)"
          # Run twice: never overwritten.
          "$RUN_BLOCK" "$DOC" install:vault-key
          test "$(sha256sum secrets/vault_key)" = "$sum"
          echo "$sum" > "$RUNNER_TEMP/vault_key.sha256"
          # The upgrade runs the same step, so an install from before the vault gets a key.
          "$(dirname "$RUN_BLOCK")/doc-block.sh" "$DOC" install:upgrade | grep -xF "$("$(dirname "$RUN_BLOCK")/doc-block.sh" "$DOC" install:vault-key)" >/dev/null
      - name: "install.md: start"
        working-directory: deploy
        run: timeout 1800 "$RUN_BLOCK" -x "$DOC" install:up
      - name: The hub opened the vault with the generated key
        working-directory: deploy
        run: |
          timeout 60 bash -c 'until docker compose logs hub | grep -q "vault: enabled"; do sleep 1; done'
          if docker compose logs hub | grep "vault: disabled"; then echo "vault disabled" >&2; exit 1; fi
      - name: The firewall is in place
        run: |
          sudo iptables -S HEARTH-BOX-IN
          sudo iptables -S HEARTH-BOX-FWD
          cat /run/hearth/box-egress.applied
          curl -fsS http://127.0.0.1:8787/healthz
      - name: The hub reports the build install.md stamped (not 0.0.0)
        working-directory: deploy
        run: |
          want="$(sed -n 's/^HEARTH_VERSION=//p' .env)"
          got="$(curl -fsS http://127.0.0.1:8787/healthz | jq -r .version)"
          echo "want=${want} got=${got}"
          test -n "$want"
          test "$got" = "$want"
          case "$got" in 0.0.0*) exit 1 ;; esac
      - name: "install.md: setup token"
        working-directory: deploy
        run: |
          out="$("$RUN_BLOCK" "$DOC" install:setup-token)"
          token="$(grep -oE 'hst_[A-Za-z0-9_-]+' <<<"$out" | head -1)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "HEARTH_SETUP_TOKEN=$token" >> "$GITHUB_ENV"
      - name: "Exit criteria: hub, login, session, tool calls in /workspace, desktop, reopen, refusals"
        run: timeout 600 bun deploy/e2e/prototype.ts install
      - name: "install.md: upgrade"
        working-directory: deploy
        run: |
          timeout 900 "$RUN_BLOCK" -x "$DOC" install:upgrade
      - name: After the upgrade the hub reports the build install.md stamped
        working-directory: deploy
        run: |
          want="$(sed -n 's/^HEARTH_VERSION=//p' .env)"
          got="$(curl -fsS http://127.0.0.1:8787/healthz | jq -r .version)"
          echo "want=${want} got=${got}"
          test -n "$want"
          test "$got" = "$want"
      - name: After the upgrade the vault key is unchanged and the vault still opens
        working-directory: deploy
        run: |
          sha256sum -c "$RUNNER_TEMP/vault_key.sha256"
          test "$(stat -c %a secrets/vault_key)" = 600
          timeout 60 bash -c 'until docker compose logs --since 10m hub | grep -q "vault: enabled"; do sleep 1; done'
          if docker compose logs hub | grep "key-mismatch"; then echo "vault key mismatch after upgrade" >&2; exit 1; fi
      - name: After the upgrade the session continues
        run: timeout 300 bun deploy/e2e/prototype.ts upgrade
      - name: "install.md: uninstall"
        working-directory: deploy
        run: |
          timeout 300 "$RUN_BLOCK" -x "$DOC" install:uninstall
          if sudo iptables -S HEARTH-BOX-IN >/dev/null 2>&1; then echo "HEARTH-BOX-IN chain left" >&2; exit 1; fi
          if sudo iptables -S HEARTH-BOX-FWD >/dev/null 2>&1; then echo "HEARTH-BOX-FWD chain left" >&2; exit 1; fi
          test ! -e /run/hearth/box-egress.applied
          left="$(docker ps -aq --filter label=dev.hearth.managed=true)"
          test -z "$left"
          left="$(docker network ls -q --filter label=dev.hearth.managed=true)"
          test -z "$left"
          docker volume ls --filter label=dev.hearth.managed=true
      - name: "install.md: purge"
        working-directory: deploy
        run: |
          timeout 300 "$RUN_BLOCK" -x "$DOC" install:purge
          left="$(docker volume ls -q --filter label=dev.hearth.managed=true)"
          test -z "$left"
          if docker volume inspect hearth_hearth-data >/dev/null 2>&1; then echo "volume hearth_hearth-data left" >&2; exit 1; fi
          if docker image inspect hearth-hub:local >/dev/null 2>&1; then echo "image hearth-hub:local left" >&2; exit 1; fi
          test ! -e secrets/vault_key
      - name: Logs
        if: failure()
        working-directory: deploy
        run: |
          docker compose logs --no-color || true
          cat "$RUNNER_TEMP/faux-model.log" || true
          docker ps -a
          for box in $(docker ps -q --filter label=dev.hearth.managed=true); do
            echo "chromium.log of ${box}:"
            docker exec "${box}" cat /tmp/chromium.log || true
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-e2e-screenshots
          path: ${{ runner.temp }}/compose-e2e
          if-no-files-found: ignore
