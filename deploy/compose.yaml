# Hearth prototype install (PRD §11.1, decision 0020). Follow docs/install.md:
#
#   cd deploy && docker compose up -d --build --wait
#
# Four services:
# - box-image: builds the image the hub starts one box container per session
#   from (hearth-box:local). It is never a running service: its container exits
#   at once.
# - box-firewall: a one-shot that applies the box egress firewall on the host
#   (scripts/box-firewall.sh, decision 0012) and writes the marker the hub
#   checks before it starts a box. Privileged on the host's network: it runs in
#   the host's network namespace with NET_ADMIN.
# - hub: the hub and the web UI, on the host's network so it can bind each box
#   network's gateway (decision 0012). Its UI/API listens on the host's
#   loopback, 127.0.0.1:8787 by default; publish it with a reverse proxy.
# - bifrost: the model gateway (PRD §6.4, decision 0046), pinned by digest, on
#   its own bridge network at a fixed address with no published port. The hub
#   reaches it from the host's network; boxes cannot (the box firewall rejects
#   private ranges and refuses an allow list that covers its address). Its
#   admin password and encryption key come from the hub's vault through a
#   tmpfs volume; its SQLite store is on a volume only it mounts.
#
# SECURITY: the hub mounts the Docker socket. Whoever controls the hub process
# controls the Docker daemon, which is root on this host. That is how the hub
# creates box containers, networks and volumes (decision 0007); keep the hub's
# API behind its login (decision 0014) and on loopback or behind TLS.
#
# Settings come from deploy/.env (copy hearth.env.example); the model key from
# the file deploy/secrets/model_key, mounted at /run/secrets/model_key. The
# vault key (decision 0031) is deploy/secrets/vault_key, written by the
# install:vault-key step; deploy/secrets is mounted read-only at
# /run/hearth-secrets so the optional vault_key.next of a key rotation needs no
# compose edit, and a missing key disables the vault instead of failing compose.

name: hearth

services:
  box-image:
    image: hearth-box:local
    build:
      context: ..
      dockerfile: apps/box-agent/Dockerfile
      args:
        # Must match the pi pin in apps/box-agent/package.json (`bun run pins`).
        PI_VERSION: "1.5.2"
    # Only this build-only container skips the image's entrypoint. The hub
    # creates session boxes through the Engine API with the image's own
    # ENTRYPOINT (decision 0018: join token file, tini), never this override.
    entrypoint: ["/bin/true"]
    command: []
    network_mode: none
    restart: "no"

  box-firewall:
    image: hearth-box-firewall:local
    build:
      context: ..
      dockerfile: deploy/firewall.Dockerfile
    command: ["apply"]
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      HEARTH_BOX_PORT: ${HEARTH_BOX_PORT:-8788}
      HEARTH_BOX_EGRESS_ALLOW: ${HEARTH_BOX_EGRESS_ALLOW:-}
      # The allow list must not cover Bifrost (decision 0046).
      HEARTH_BIFROST_ADDR: ${HEARTH_BIFROST_ADDR:-172.29.249.2}
      HEARTH_IPTABLES: ${HEARTH_IPTABLES:-}
    volumes:
      # The marker lives in the host's /run (tmpfs): gone after a reboot, like
      # the rules. The hub reads the same directory.
      - /run/hearth:/run/hearth
    restart: "no"

  hub:
    image: hearth-hub:local
    build:
      context: ..
      dockerfile: deploy/hub.Dockerfile
      args:
        # Stamped on trajectories and /healthz (decision 0021); docs/install.md
        # writes `git describe --always --dirty` into .env as HEARTH_VERSION.
        HEARTH_VERSION: ${HEARTH_VERSION:-}
    network_mode: host
    # Root in the container: see SECURITY above (decision 0020).
    user: "0:0"
    init: true
    restart: unless-stopped
    depends_on:
      box-image:
        condition: service_completed_successfully
      box-firewall:
        condition: service_completed_successfully
    # No dependency on bifrost (decision 0046): model calls do not go through
    # it yet, so the hub starts and stays healthy when Bifrost cannot (no
    # access to getbifrost.ai, the vault disabled, an allow list covering it).
    # docs/install.md starts it with `docker compose up -d bifrost`; /healthz
    # reports it as `bifrost`.
    environment:
      HEARTH_HOST: ${HEARTH_HOST:-127.0.0.1}
      HEARTH_PORT: ${HEARTH_PORT:-8787}
      HEARTH_BOX_PORT: ${HEARTH_BOX_PORT:-8788}
      HEARTH_PUBLIC_ORIGIN: ${HEARTH_PUBLIC_ORIGIN:-}
      HEARTH_MODEL_PROVIDER: ${HEARTH_MODEL_PROVIDER:-}
      HEARTH_MODEL: ${HEARTH_MODEL:-}
      HEARTH_MODEL_KEY_REF: file:/run/secrets/model_key
      HEARTH_MODELS_FILE: ${HEARTH_MODELS_FILE:-}
      HEARTH_VAULT_KEY_REF: file:/run/hearth-secrets/vault_key
      HEARTH_VAULT_KEY_NEXT_REF: file:/run/hearth-secrets/vault_key.next
      HEARTH_IDLE_MINUTES: ${HEARTH_IDLE_MINUTES:-}
      HEARTH_BOX_EGRESS: ${HEARTH_BOX_EGRESS:-}
      HEARTH_BOX_INSTANCE: ${HEARTH_BOX_INSTANCE:-hearth}
      HEARTH_BOX_IMAGE: hearth-box:local
      HEARTH_BOX_PULL: never
      HEARTH_BIFROST_URL: http://${HEARTH_BIFROST_ADDR:-172.29.249.2}:8080
      HEARTH_BIFROST_HANDOFF_DIR: /run/hearth-bifrost
    secrets:
      - model_key
    volumes:
      - hearth-data:/data
      # Root-equivalent: see SECURITY above.
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/hearth:/run/hearth:ro
      - ./config:/etc/hearth:ro
      - ./secrets:/run/hearth-secrets:ro
      - bifrost-handoff:/run/hearth-bifrost

  bifrost:
    # Bifrost v2.5.1 (maximhq/bifrost, Apache-2.0): the multi-arch index digest
    # of maximhq/bifrost:v2.5.1 from the registry API (decision 0046).
    image: maximhq/bifrost@sha256:5ec9873acaf1687556b6e4dd854b92b539d9debf87a5a683b66338648b84d3c8
    # deploy/bifrost/start.sh waits for the vault's secrets, then runs the
    # image's own entrypoint.
    entrypoint: ["/bin/sh", "/etc/hearth-bifrost/start.sh"]
    command: ["/app/docker-entrypoint.sh", "/app/main"]
    init: true
    restart: unless-stopped
    environment:
      LOG_STYLE: json
    networks:
      bifrost:
        ipv4_address: ${HEARTH_BIFROST_ADDR:-172.29.249.2}
    # No `ports`: nothing is published on the host.
    volumes:
      # Its config store (provider keys, encrypted with the vault's
      # bifrost-encryption-key) and request logs. Neither a box nor the hub mounts it.
      - bifrost-data:/app/data
      - ./bifrost:/etc/hearth-bifrost:ro
      - bifrost-handoff:/run/hearth-bifrost:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

networks:
  # Bifrost's own bridge. Not `internal: true`: Bifrost needs the providers and
  # its pricing sync (docs/install.md). Its subnet is private, so the box
  # firewall's private-range rules keep boxes off it.
  bifrost:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: hearth-bifrost
    ipam:
      config:
        - subnet: ${HEARTH_BIFROST_SUBNET:-172.29.249.0/29}

secrets:
  model_key:
    file: ./secrets/model_key

volumes:
  hearth-data:
  bifrost-data:
  # Memory only: the hub writes Bifrost's secrets here from the vault at every
  # start (decision 0046). Group 0 (Bifrost's group) may read.
  bifrost-handoff:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=0750
